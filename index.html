<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Gallery</title>

<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Enable Tailwind's class-based dark mode
  tailwind.config = { darkMode: 'class' };
</script>

<!-- Icons (feather-icons via CDN, lightweight) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>

<style>
  /* Small extras Tailwind utility classes can't do cleanly */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 9999px; }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  /* simple skeleton shimmer for images while loading */
  .skeleton {
    background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.12) 37%, rgba(255,255,255,.06) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
</style>
</head>

<body class="bg-neutral-950 text-neutral-100 dark:bg-neutral-950 dark:text-neutral-100 min-h-screen transition-colors duration-300">

  <!-- ============================================================
       PIN LOCK SCREEN
       Shown first on every load. Enter the correct PIN (set below
       in the JS as `correctPin`) to reveal the gallery.
       NOTE: this is a simple front-end gate for casual privacy —
       anyone who views the page source or repo files can bypass it,
       since GitHub Pages has no real backend/auth.
  ============================================================= -->
  <div id="lock-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-neutral-950 px-4">
    <div class="w-full max-w-xs text-center fade-in">
      <div class="w-14 h-14 mx-auto mb-5 rounded-full bg-white/5 border border-white/10 flex items-center justify-center">
        <i data-feather="lock" class="w-6 h-6 text-indigo-400"></i>
      </div>
      <h1 class="text-lg font-semibold mb-1">Enter PIN</h1>
      <p class="text-sm text-neutral-400 mb-6">This gallery is private</p>

      <form id="pin-form" autocomplete="off">
        <input
          id="pin-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]*"
          maxlength="8"
          placeholder="••••"
          class="w-full text-center text-2xl tracking-[0.5em] bg-white/5 border border-white/10 rounded-xl py-3 px-4 text-neutral-100 placeholder-neutral-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
        />
        <p id="pin-error" class="text-sm text-red-400 mt-3 h-5 hidden">Incorrect PIN. Try again.</p>
        <button type="submit"
          class="mt-3 w-full py-3 rounded-xl bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium transition-colors">
          Unlock
        </button>
      </form>
    </div>
  </div>

  <!-- ============================================================
       HEADER / NAV
  ============================================================= -->
  <header class="sticky top-0 z-40 backdrop-blur-lg bg-neutral-950/70 dark:bg-neutral-950/70 border-b border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between">
      <h1 class="text-lg sm:text-xl font-semibold tracking-tight flex items-center gap-2">
        <i data-feather="aperture" class="w-5 h-5 text-indigo-400"></i>
        My Gallery
      </h1>

      <div class="flex items-center gap-2">
        <!-- Photos / Videos toggle -->
        <div class="flex bg-white/5 rounded-full p-1 border border-white/10">
          <button id="tab-photos"
            class="tab-btn px-4 py-1.5 text-sm font-medium rounded-full transition-all duration-200 bg-indigo-500 text-white shadow-sm">
            Photos
          </button>
          <button id="tab-videos"
            class="tab-btn px-4 py-1.5 text-sm font-medium rounded-full transition-all duration-200 text-neutral-300 hover:text-white">
            Videos
          </button>
        </div>

        <!-- Theme toggle -->
        <button id="theme-toggle"
          class="ml-1 p-2 rounded-full border border-white/10 bg-white/5 hover:bg-white/10 transition-colors"
          title="Toggle light / dark mode">
          <i data-feather="moon" class="w-4 h-4" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ============================================================
       MAIN CONTENT
  ============================================================= -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">

    <!-- ---------------- PHOTOS SECTION ---------------- -->
    <section id="section-photos">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-2xl font-bold">Photos</h2>
        <span class="text-sm text-neutral-400" id="photos-count"></span>
      </div>
      <div id="photos-grid"
        class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-4">
        <!-- Photo cards injected by JS -->
      </div>
    </section>

    <!-- ---------------- VIDEOS SECTION ---------------- -->
    <section id="section-videos" class="hidden">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-2xl font-bold">Videos</h2>
        <span class="text-sm text-neutral-400" id="videos-count"></span>
      </div>
      <div id="videos-grid"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
        <!-- Video cards injected by JS -->
      </div>
    </section>

  </main>

  <footer class="max-w-6xl mx-auto px-4 sm:px-6 py-10 text-center text-xs text-neutral-500">
    Built with HTML, Tailwind CSS &amp; vanilla JS · Hosted on GitHub Pages
  </footer>

  <!-- ============================================================
       LIGHTBOX (photo full view)
  ============================================================= -->
  <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-sm p-4">
    <button id="lightbox-close" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 rounded-full bg-white/10 hover:bg-white/20 transition-colors">
      <i data-feather="x" class="w-5 h-5"></i>
    </button>
    <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl fade-in" />
    <a id="lightbox-download" href="" download
      class="absolute bottom-6 left-1/2 -translate-x-1/2 flex items-center gap-2 px-5 py-2.5 rounded-full bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium transition-colors">
      <i data-feather="download" class="w-4 h-4"></i> Download
    </a>
  </div>

  <!-- ============================================================
       VIDEO PLAYER MODAL
  ============================================================= -->
  <div id="video-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/90 backdrop-blur-sm p-4">
    <button id="video-modal-close" class="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 rounded-full bg-white/10 hover:bg-white/20 transition-colors">
      <i data-feather="x" class="w-5 h-5"></i>
    </button>
    <div class="w-full max-w-3xl fade-in">
      <video id="video-player" class="w-full max-h-[75vh] rounded-lg shadow-2xl bg-black" controls playsinline>
        Your browser does not support the video tag.
      </video>
      <div class="flex items-center justify-between mt-4 px-1">
        <h3 id="video-modal-title" class="text-base sm:text-lg font-medium truncate pr-4"></h3>
        <a id="video-modal-download" href="" download
          class="shrink-0 flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium transition-colors">
          <i data-feather="download" class="w-4 h-4"></i> Download
        </a>
      </div>
    </div>
  </div>

  <script>
  /* ============================================================
     0. PIN LOCK
     -----------------------------------------------------------
     Change the PIN by editing the string below (numbers only,
     1-8 digits). This is a simple front-end gate, not real
     security — the gallery files are still reachable directly
     by anyone who knows/finds the URL or repo, since GitHub
     Pages has no backend to enforce auth server-side.
  ============================================================= */

  const correctPin = "4019"; // 👈 change this to your own numeric PIN

  const lockScreen = document.getElementById('lock-screen');
  const pinForm = document.getElementById('pin-form');
  const pinInput = document.getElementById('pin-input');
  const pinError = document.getElementById('pin-error');

  // Only allow digits to be typed
  pinInput.addEventListener('input', () => {
    pinInput.value = pinInput.value.replace(/[^0-9]/g, '');
    pinError.classList.add('hidden');
  });

  pinForm.addEventListener('submit', (e) => {
    e.preventDefault();
    if (pinInput.value === correctPin) {
      sessionStorage.setItem('gallery-unlocked', 'true');
      unlockGallery();
    } else {
      pinError.classList.remove('hidden');
      pinInput.value = '';
      pinInput.focus();
      // small shake for feedback
      pinInput.classList.add('ring-2', 'ring-red-500');
      setTimeout(() => pinInput.classList.remove('ring-2', 'ring-red-500'), 400);
    }
  });

  function unlockGallery() {
    lockScreen.classList.add('hidden');
    document.body.style.overflow = '';
  }

  // Stay unlocked for the rest of this browser tab session
  if (sessionStorage.getItem('gallery-unlocked') === 'true') {
    unlockGallery();
  } else {
    document.body.style.overflow = 'hidden';
    pinInput.focus();
  }

  /* ============================================================
     1. DATA
     -----------------------------------------------------------
     Add new photos/videos by copy-pasting a new object into
     these arrays. Nothing else in the code needs to change.

     PHOTO OBJECT FIELDS:
       src   -> full-size image URL (or path to file in your repo, e.g. "media/photos/img1.jpg")
       thumb -> optional smaller/preview URL (falls back to src if omitted)
       title -> caption shown on hover
       alt   -> accessibility text

     VIDEO OBJECT FIELDS:
       src      -> video file URL/path (e.g. "media/videos/clip1.mp4")
       poster   -> thumbnail image shown before playing
       title    -> video title
       duration -> optional text badge, e.g. "1:24" (leave "" to omit)
  ============================================================= */

  const photos = [
    {
      src: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=500&q=60",
      title: "Mountain Lake",
      alt: "Mountains reflected in a still lake"
    },
    {
      src: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500&q=60",
      title: "Forest Path",
      alt: "Sunlight through a forest path"
    },
    {
      src: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500&q=60",
      title: "Mountain Range",
      alt: "Snow capped mountain range at dusk"
    },
    {
      src: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1500534623283-312aade485b7?w=500&q=60",
      title: "Desert Dunes",
      alt: "Sand dunes under a clear sky"
    },
    {
      src: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=500&q=60",
      title: "City Skyline",
      alt: "City skyline at night"
    },
    {
      src: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=1600&q=80",
      thumb: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=500&q=60",
      title: "Green Valley",
      alt: "Rolling green valley with a lone tree"
    },
    // 👉 Add more photos here, e.g.:
    // {
    //   src: "media/photos/my-photo.jpg",
    //   thumb: "media/photos/my-photo-thumb.jpg",
    //   title: "My Photo Title",
    //   alt: "Description of photo"
    // },
  ];

  const videos = [
    {
      src: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4",
      poster: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800&q=70",
      title: "Blooming Flower",
      duration: "0:10"
    },
    {
      src: "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm",
      poster: "https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=800&q=70",
      title: "Blooming Flower (WebM)",
      duration: "0:10"
    },
    {
      src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
      poster: "https://images.unsplash.com/photo-1517649763962-0c623066013b?w=800&q=70",
      title: "For Bigger Blazes",
      duration: "0:15"
    },
    {
      src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
      poster: "https://images.unsplash.com/photo-1533587851505-d119e13fa0d7?w=800&q=70",
      title: "For Bigger Escapes",
      duration: "0:15"
    },
    {
      src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4",
      poster: "https://images.unsplash.com/photo-1526481280693-3bfa7568e0f3?w=800&q=70",
      title: "For Bigger Fun",
      duration: "0:15"
    },
    {
      src: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
      poster: "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=800&q=70",
      title: "For Bigger Joyrides",
      duration: "0:15"
    },
    // 👉 Add more videos here, e.g.:
    // {
    //   src: "media/videos/my-video.mp4",
    //   poster: "media/videos/my-video-poster.jpg",
    //   title: "My Video Title",
    //   duration: "1:30"
    // },
  ];

  /* ============================================================
     2. RENDERING
  ============================================================= */

  const photosGrid = document.getElementById('photos-grid');
  const videosGrid = document.getElementById('videos-grid');

  function renderPhotos() {
    photosGrid.innerHTML = photos.map((p, i) => `
      <div class="group relative rounded-xl overflow-hidden aspect-square bg-white/5 border border-white/10 fade-in cursor-pointer"
           onclick="openLightbox(${i})">
        <img src="${p.thumb || p.src}" alt="${p.alt || p.title}" loading="lazy"
             class="w-full h-full object-cover skeleton transition-transform duration-300 group-hover:scale-105"
             onload="this.classList.remove('skeleton')" />
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/0 to-black/0 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
        <div class="absolute bottom-0 left-0 right-0 p-3 flex items-end justify-between opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          <span class="text-sm font-medium text-white truncate pr-2">${p.title}</span>
          <a href="${p.src}" download title="Download"
             onclick="event.stopPropagation()"
             class="shrink-0 p-2 rounded-full bg-white/15 hover:bg-indigo-500 backdrop-blur-sm transition-colors">
            <i data-feather="download" class="w-4 h-4 text-white"></i>
          </a>
        </div>
      </div>
    `).join('');
    document.getElementById('photos-count').textContent = `${photos.length} item${photos.length !== 1 ? 's' : ''}`;
    feather.replace();
  }

  function renderVideos() {
    videosGrid.innerHTML = videos.map((v, i) => `
      <div class="group relative rounded-xl overflow-hidden bg-white/5 border border-white/10 fade-in">
        <div class="relative aspect-video cursor-pointer" onclick="openVideoModal(${i})">
          <img src="${v.poster}" alt="${v.title}" loading="lazy"
               class="w-full h-full object-cover skeleton transition-transform duration-300 group-hover:scale-105"
               onload="this.classList.remove('skeleton')" />
          <div class="absolute inset-0 bg-black/30 flex items-center justify-center opacity-90 group-hover:opacity-100 transition-opacity">
            <div class="w-14 h-14 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center group-hover:bg-indigo-500 transition-colors">
              <i data-feather="play" class="w-6 h-6 text-white ml-0.5"></i>
            </div>
          </div>
          ${v.duration ? `<span class="absolute bottom-2 right-2 text-xs px-1.5 py-0.5 rounded bg-black/70 text-white">${v.duration}</span>` : ''}
        </div>
        <div class="p-3 flex items-center justify-between gap-2">
          <span class="text-sm font-medium truncate">${v.title}</span>
          <a href="${v.src}" download title="Download"
             class="shrink-0 p-2 rounded-full bg-white/10 hover:bg-indigo-500 transition-colors">
            <i data-feather="download" class="w-4 h-4"></i>
          </a>
        </div>
      </div>
    `).join('');
    document.getElementById('videos-count').textContent = `${videos.length} item${videos.length !== 1 ? 's' : ''}`;
    feather.replace();
  }

  /* ============================================================
     3. TABS (Photos / Videos)
  ============================================================= */

  const tabPhotos = document.getElementById('tab-photos');
  const tabVideos = document.getElementById('tab-videos');
  const sectionPhotos = document.getElementById('section-photos');
  const sectionVideos = document.getElementById('section-videos');

  function activateTab(tab) {
    const isPhotos = tab === 'photos';
    sectionPhotos.classList.toggle('hidden', !isPhotos);
    sectionVideos.classList.toggle('hidden', isPhotos);

    tabPhotos.classList.toggle('bg-indigo-500', isPhotos);
    tabPhotos.classList.toggle('text-white', isPhotos);
    tabPhotos.classList.toggle('text-neutral-300', !isPhotos);

    tabVideos.classList.toggle('bg-indigo-500', !isPhotos);
    tabVideos.classList.toggle('text-white', !isPhotos);
    tabVideos.classList.toggle('text-neutral-300', isPhotos);

    // pause video if switching away
    if (isPhotos) closeVideoModal();

    localStorage.setItem('gallery-tab', tab);
  }

  tabPhotos.addEventListener('click', () => activateTab('photos'));
  tabVideos.addEventListener('click', () => activateTab('videos'));

  /* ============================================================
     4. LIGHTBOX (photos)
  ============================================================= */

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightbox-img');
  const lightboxDownload = document.getElementById('lightbox-download');

  function openLightbox(index) {
    const p = photos[index];
    lightboxImg.src = p.src;
    lightboxImg.alt = p.alt || p.title;
    lightboxDownload.href = p.src;
    lightbox.classList.remove('hidden');
    lightbox.classList.add('flex');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    lightbox.classList.add('hidden');
    lightbox.classList.remove('flex');
    lightboxImg.src = '';
    document.body.style.overflow = '';
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

  /* ============================================================
     5. VIDEO MODAL
  ============================================================= */

  const videoModal = document.getElementById('video-modal');
  const videoPlayer = document.getElementById('video-player');
  const videoModalTitle = document.getElementById('video-modal-title');
  const videoModalDownload = document.getElementById('video-modal-download');

  function openVideoModal(index) {
    const v = videos[index];
    videoPlayer.src = v.src;
    videoPlayer.poster = v.poster || '';
    videoModalTitle.textContent = v.title;
    videoModalDownload.href = v.src;
    videoModal.classList.remove('hidden');
    videoModal.classList.add('flex');
    document.body.style.overflow = 'hidden';
    videoPlayer.play().catch(() => {}); // autoplay may be blocked; fine either way
  }

  function closeVideoModal() {
    videoPlayer.pause();
    videoPlayer.removeAttribute('src');
    videoPlayer.load();
    videoModal.classList.add('hidden');
    videoModal.classList.remove('flex');
    document.body.style.overflow = '';
  }

  document.getElementById('video-modal-close').addEventListener('click', closeVideoModal);
  videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeVideoModal(); });

  /* ============================================================
     6. THEME TOGGLE (dark by default, light optional)
  ============================================================= */

  const html = document.documentElement;
  const themeToggle = document.getElementById('theme-toggle');
  const themeIcon = document.getElementById('theme-icon');

  function setTheme(mode) {
    const isDark = mode === 'dark';
    html.classList.toggle('dark', isDark);
    document.body.classList.toggle('bg-neutral-950', isDark);
    document.body.classList.toggle('text-neutral-100', isDark);
    document.body.classList.toggle('bg-neutral-50', !isDark);
    document.body.classList.toggle('text-neutral-900', !isDark);
    themeIcon.setAttribute('data-feather', isDark ? 'moon' : 'sun');
    feather.replace();
    localStorage.setItem('gallery-theme', mode);
  }

  themeToggle.addEventListener('click', () => {
    const current = localStorage.getItem('gallery-theme') || 'dark';
    setTheme(current === 'dark' ? 'light' : 'dark');
  });

  /* ============================================================
     7. ESCAPE KEY CLOSES ANY OPEN MODAL
  ============================================================= */

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeLightbox();
      closeVideoModal();
    }
  });

  /* ============================================================
     8. INIT
  ============================================================= */

  renderPhotos();
  renderVideos();
  activateTab(localStorage.getItem('gallery-tab') || 'photos');
  setTheme(localStorage.getItem('gallery-theme') || 'dark');
  feather.replace();

  </script>
</body>
</html>
